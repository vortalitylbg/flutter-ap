openapi: 3.0.0
info:
  title: API Mobile ResaChev
  version: v1.0.0
  description: Documentation de l'API mobile pour l'application Flutter (staff terrain).

servers:
  - url: http://localhost:8000/api
    description: Serveur de développement local
  - url: http://resachev.dombtsig.local/api
    description: Serveur de démonstration

components:
  schemas:
    Utilisateur:
      type: object
      description: Informations sur un utilisateur staff.
      properties:
        idutilisateur:
          type: integer
          description: Identifiant unique de l'utilisateur.
          example: 3
        nom:
          type: string
          example: "Dupont"
        prenom:
          type: string
          example: "Jean"
        email:
          type: string
          format: email
          example: "jean.dupont@example.com"

    Reservation:
      type: object
      description: Informations sur une réservation à venir.
      properties:
        idreservation:
          type: integer
          example: 12
        datedebut:
          type: string
          example: "02/07/2026"
        heuredebut:
          type: string
          example: "09:30"
        validationpresence:
          type: boolean
          example: false
        prestation:
          type: string
          example: "exemple prestation1"
        client:
          type: object
          properties:
            nom:
              type: string
              example: "Martin"
            prenom:
              type: string
              example: "Sophie"

    ReservationClient:
      type: object
      description: Réservation accompagnée des informations de la personne concernée.
      properties:
        idreservation:
          type: integer
          example: 12
        datedebut:
          type: string
          example: "02/07/2026"
        heuredebut:
          type: string
          example: "09:30"
        validationpresence:
          type: boolean
          example: false
        prestation:
          type: string
          example: "exemple prestation1"
        client:
          type: object
          properties:
            idutilisateur:
              type: integer
              example: 4
            nom:
              type: string
              example: "Martin"
            prenom:
              type: string
              example: "Sophie"
            email:
              type: string
              format: email
              example: "sophie.martin@example.com"

    Profil:
      type: object
      description: Informations du staff connecté.
      properties:
        idutilisateur:
          type: integer
          example: 3
        idrole:
          type: integer
          nullable: true
          example: 2
        nom:
          type: string
          example: "Dupont"
        prenom:
          type: string
          example: "Jean"
        email:
          type: string
          format: email
          nullable: true
          example: "jean.dupont@example.com"

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: "Token Sanctum obtenu après vérification du code 2FA. À fournir dans l'en-tête Authorization : 'Bearer {token}'"

paths:
  /mobile/login:
    post:
      summary: Étape 1 – Connexion (email / mot de passe)
      description: |
        Vérifie les identifiants du membre staff et envoie un code 2FA à 6 chiffres par email.
        Le token Sanctum n'est **pas** retourné à cette étape.
        Seuls les utilisateurs avec le rôle **staff** (`idrole = 2`) sont autorisés.
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - motpasse
              properties:
                email:
                  type: string
                  format: email
                  example: "staff@example.com"
                motpasse:
                  type: string
                  format: password
                  example: "monmotdepasse"
      responses:
        "200":
          description: Identifiants valides, code 2FA envoyé par email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Un code de vérification a été envoyé par email."
                  email:
                    type: string
                    example: "staff@example.com"
        "401":
          description: Identifiants invalides ou utilisateur non staff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Identifiants invalides ou accès non autorisé."
        "422":
          description: Données manquantes ou invalides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mobile/verify-2fa:
    post:
      summary: Étape 2 – Vérification du code 2FA
      description: |
        Vérifie le code 2FA reçu par email. Si valide et non expiré (10 minutes),
        retourne le token Sanctum à utiliser pour les requêtes protégées.
        Le code est invalidé immédiatement après usage.
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                  example: "staff@example.com"
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: "482917"
      responses:
        "200":
          description: Code valide, token Sanctum retourné.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "1|abcdefghijklmnopqrstuvwxyz123456"
                  utilisateur:
                    $ref: "#/components/schemas/Utilisateur"
        "401":
          description: Code invalide ou expiré.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Code invalide ou expiré."
        "422":
          description: Données manquantes ou invalides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mobile/me:
    get:
      summary: Informations du staff connecté
      description: |
        Retourne les informations de l'utilisateur associé au token Sanctum fourni.
        Le mot de passe et les colonnes `two_factor_*` ne sont jamais exposés.
      tags:
        - Authentification
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Informations de l'utilisateur connecté.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profil"
        "401":
          description: Token manquant ou invalide.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Unauthenticated."
    put:
      summary: Mise à jour du profil du staff connecté
      description: |
        Met à jour les informations de l'utilisateur associé au token Sanctum fourni.
        Seul le champ `nom` est modifiable pour l'instant, les autres champs envoyés sont ignorés.
      tags:
        - Authentification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nom
              properties:
                nom:
                  type: string
                  maxLength: 100
                  example: "Dupont"
      responses:
        "200":
          description: Profil mis à jour.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Profil mis à jour."
                  utilisateur:
                    $ref: "#/components/schemas/Profil"
        "401":
          description: Token manquant ou invalide.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Unauthenticated."
        "422":
          description: Données manquantes ou invalides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mobile/rdv:
    get:
      summary: Liste des prochains rendez-vous
      description: |
        Retourne toutes les réservations à partir d'aujourd'hui, triées par date et heure croissantes.
        Inclut les informations du client et de la prestation.
      tags:
        - Réservations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des réservations à venir.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        "401":
          description: Token manquant ou invalide.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Unauthenticated."

  /mobile/valider-presence:
    post:
      summary: Valider la présence d'un client
      description: |
        Marque la présence d'un client comme validée à partir de l'identifiant de réservation
        transmis via le QR code scanné. Retourne une erreur 409 si la présence est déjà validée.
      tags:
        - Réservations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idreservation
              properties:
                idreservation:
                  type: integer
                  example: 12
      responses:
        "200":
          description: Présence validée avec succès.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Présence validée."
                  idreservation:
                    type: integer
                    example: 12
        "409":
          description: Présence déjà validée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Présence déjà validée."
        "401":
          description: Token manquant ou invalide.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Unauthenticated."
        "422":
          description: Données manquantes ou réservation introuvable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mobile/reservation/{idreservation}/client:
    get:
      summary: Informations de la personne liée à une réservation
      description: |
        Retourne les informations du client rattaché à la réservation dont l'identifiant est
        transmis dans l'URL (identifiant lu dans le QR code présenté par le client).
      tags:
        - Réservations
      security:
        - bearerAuth: []
      parameters:
        - name: idreservation
          in: path
          required: true
          description: Identifiant de la réservation.
          schema:
            type: integer
            example: 12
      responses:
        "200":
          description: Réservation trouvée, informations du client retournées.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationClient"
        "401":
          description: Token manquant ou invalide.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Unauthenticated."
        "404":
          description: Aucune réservation ne correspond à cet identifiant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Cette réservation n'existe pas."
